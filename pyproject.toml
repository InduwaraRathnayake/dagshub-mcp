[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagshub-mcp"
version = "0.1.0"
description = "Read-only MCP tools for evidence-based DagsHub experiment analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3,<3", "httpx>=0.28,<1", "pydantic>=2.12,<3"]

[project.scripts]
dagshub-mcp = "dagshub_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: opt-in live DagsHub integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

